services:
  pharmaqc-api:
    build: .
    container_name: pharmaqc-api
    ports:
      - "8000:8000"
    environment:
      # По умолчанию сервис работает локально и не требует внешних ключей.
      - PHARMAQC_ENGINE=${PHARMAQC_ENGINE:-local}
      # Ключ используется только при PHARMAQC_ENGINE=groq; в образ он не копируется
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./data:/app/data      # индекс ChromaDB и результаты оценки
      - ./config:/app/config  # конфигурация и промпт
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
